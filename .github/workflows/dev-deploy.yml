name: CI/CD Pipeline

on:
  push:
    branches: [ "development" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registry-ids: 34565432345  # Your ECR registry ID

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and Push Docker image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_URI=34565432345.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
          docker build --no-cache -t $IMAGE_URI:$COMMIT_SHA .
          docker push $IMAGE_URI:$COMMIT_SHA
          echo "IMAGE_TAG=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Create PEM file
        run: |
          echo "$PEM_FILE" > dev-key.pem
          chmod 400 dev-key.pem
        env:
          PEM_FILE: ${{ secrets.EC2_KEY }}

      - name: Create deployment script
        run: |
          IMAGE_URI=34565432345.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
          TAG=${{ env.IMAGE_TAG }}
          cat << 'EOF' > deploy.sh
          #!/bin/bash
          set -e
          echo "✅ Logged into EC2"
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_REGION="$AWS_REGION"
          IMAGE_URI="$IMAGE_URI"
          TAG="$TAG"
          
          echo "🔐 Logging into ECR..."
          rm -f ~/.docker/config.json
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $IMAGE_URI
          
          echo "🛑 Stopping existing container..."
          sudo docker stop app || true
          sudo docker rm app || true
          
          echo "🧹 Cleaning up old image..."
          sudo docker rmi -f $IMAGE_URI:$TAG || true
          
          echo "⬇️ Pulling new image..."
          sudo docker pull $IMAGE_URI:$TAG
          
          echo "🚀 Starting container..."
          sudo docker run -d --name app -p 80:8080 $IMAGE_URI:$TAG
          
          echo "🔍 Verifying deployment..."
          sudo docker inspect app --format '{{ .Image }}'
          EOF
          
          chmod +x deploy.sh

      - name: Deploy to EC2
        run: |
          ssh -i dev-key.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} 'bash -s' < deploy.sh

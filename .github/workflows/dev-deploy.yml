name: CI/CD Pipeline

on:
  push:
    branches: ["development"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region eu-north-1 | \
          docker login --username AWS --password-stdin 941377157856.dkr.ecr.eu-north-1.amazonaws.com

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and Push Docker image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_URI=941377157856.dkr.ecr.eu-north-1.amazonaws.com/dv-mopix-ecr-repo

          docker build --no-cache -t $IMAGE_URI:$COMMIT_SHA -t $IMAGE_URI:latest .
          docker push $IMAGE_URI:$COMMIT_SHA
          docker push $IMAGE_URI:latest

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "IMAGE_TAG=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Create PEM file
        run: |
          echo "${{ secrets.EC2_KEY }}" > dev-key.pem
          chmod 400 dev-key.pem

      - name: Deploy to EC2
        env:
          IMAGE_URI: ${{ env.IMAGE_URI }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh -i dev-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
            set -e

            echo "Deploying Docker image: \$IMAGE_URI:\$IMAGE_TAG"

            # Stop and remove existing container if it exists
            sudo docker ps -q --filter "name=app" | grep -q . && sudo docker stop app || true
            sudo docker ps -a -q --filter "name=app" | grep -q . && sudo docker rm app || true

            # Authenticate Docker with ECR
            rm ~/.docker/config.json
            aws ecr get-login-password --region eu-north-1 | \
              sudo docker login --username AWS --password-stdin 941377157856.dkr.ecr.eu-north-1.amazonaws.com

            # Pull and run the container
            sudo docker pull \$IMAGE_URI:\$IMAGE_TAG
            sudo docker run -d --restart unless-stopped --name app -p 80:8080 \$IMAGE_URI:\$IMAGE_TAG
          EOF

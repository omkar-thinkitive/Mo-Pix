name: CI/CD Pipeline

on:
  push:
    branches: [ "development" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and Push Docker image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_URI=941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
          
          docker build --no-cache -t $IMAGE_URI:latest -t $IMAGE_URI:$COMMIT_SHA .
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:$COMMIT_SHA
          
          echo "IMAGE_TAG=$COMMIT_SHA" >> $GITHUB_ENV

      - name: Create PEM file
        run: |
          echo "$PEM_FILE" > dev-key.pem
          chmod 400 dev-key.pem
        env:
          PEM_FILE: ${{ secrets.EC2_KEY }}

      - name: SSH and Deploy on EC2
        run: |
          ssh -i dev-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
            echo "Logged into EC2"

            IMAGE_URI=941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
            TAG=${{ env.IMAGE_TAG }}

            # Login to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            # Stop and remove existing container
            sudo docker stop app || true
            sudo docker rm app || true

            # Remove old image (optional safety)
            sudo docker -f rmi \$IMAGE_URI:latest || true
            sudo docker -f rmi \$IMAGE_URI:\$TAG || true

            # Pull the latest by tag
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            # Stop and remove existing container
            sudo docker pull \$IMAGE_URI:\$TAG

            # Run container
            sudo docker run -d --name app -p 80:8080 \$IMAGE_URI:\$TAG
          EOF

name: CI/CD Pipeline

on:
  push:
    branches: [ "development" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and Push Docker image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_URI=941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
          docker build --no-cache -t $IMAGE_URI:latest -t $IMAGE_URI:$COMMIT_SHA .
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:$COMMIT_SHA
          echo "IMAGE_TAG=$COMMIT_SHA" >> $GITHUB_ENV
      - name: Create PEM file
        run: |
          echo "$PEM_FILE" > dev-key.pem
          chmod 400 dev-key.pem
        env:
          PEM_FILE: ${{ secrets.EC2_KEY }}

      - name: Create deployment script
        run: |
          IMAGE_URI=941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
          TAG=${{ env.IMAGE_TAG }}
          CONTAINER_NAME=$(basename $IMAGE_URI)
          cat << EOF > deploy.sh
          #!/bin/bash
          set -e
          echo "✅ Logged into EC2"
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_REGION="${{ secrets.AWS_REGION }}"
          IMAGE_URI="$IMAGE_URI"
          TAG="$TAG"
          echo "🔐 Logging into ECR (inside EC2)..."
          rm -f ~/.docker/config.json
          aws ecr get-login-password --region \$AWS_REGION | docker login --username AWS --password-stdin \$IMAGE_URI
          echo "🛑 Stopping existing container (if any)..."
          sudo docker stop app || true
          sudo docker rm app || true
          echo "🧹 Removing old images..."
          sudo docker rmi -f \$IMAGE_URI:latest || true
          sudo docker rmi -f \$IMAGE_URI:\$TAG || true
          echo "⬇️ Pulling latest image..."
          sudo docker pull \$IMAGE_URI:\$TAG
          echo "🚀 Running container..."
          echo "sudo docker run -d --name $CONTAINER_NAME -p 80:8080 $IMAGE_URI:$TAG"
          sudo docker run -d --name $CONTAINER_NAME -p 80:8080 \$IMAGE_URI:\$TAG
          EOF
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

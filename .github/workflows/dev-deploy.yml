name: CI/CD Pipeline

on:
  push:
    branches: [ "development" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and Push Docker image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_URI=941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
          docker build --no-cache -t $IMAGE_URI:latest -t $IMAGE_URI:$COMMIT_SHA .
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:$COMMIT_SHA
          echo "IMAGE_TAG=$COMMIT_SHA" >> $GITHUB_ENV
      - name: Create PEM file
        run: |
          echo "${{ secrets.EC2_KEY }}" > dev-key.pem
          chmod 400 dev-key.pem
      - name: Deploy to EC2
        run: |
          # Generate ECR login command that works with sudo
          ECR_LOGIN_CMD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            docker login --username AWS --password-stdin 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com | \
            sed 's/docker/sudo docker/')
          
          # Create deployment script
          cat > deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          
          # Export AWS credentials
          export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export AWS_REGION="$AWS_REGION"
          
          IMAGE_URI="941377157856.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_NAME"
          TAG="$IMAGE_TAG"
          
          # Login to ECR
          $ECR_LOGIN_CMD
          
          # Stop and remove old container
          sudo docker stop app || true
          sudo docker rm app || true
          
          # Pull new image
          sudo docker pull $IMAGE_URI:$TAG
          
          # Run new container
          sudo docker run -d \
            --name app \
            -p 80:8080 \
            --restart unless-stopped \
            $IMAGE_URI:$TAG
          SCRIPT
          
          # Copy and execute script on EC2
          scp -i dev-key.pem -o StrictHostKeyChecking=no deploy.sh ubuntu@${{ secrets.EC2_HOST }}:~/deploy.sh
          ssh -i dev-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} \
            "chmod +x deploy.sh && \
            AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}' \
            AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            AWS_REGION='${{ secrets.AWS_REGION }}' \
            ECR_NAME='${{ secrets.ECR_NAME }}' \
            IMAGE_TAG='${{ env.IMAGE_TAG }}' \
            ECR_LOGIN_CMD='$ECR_LOGIN_CMD' \
            ./deploy.sh"

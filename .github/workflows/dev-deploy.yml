name: CI/CD Pipeline

on:
  push:
    branches: [ "development" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPOSITORY: ${{ secrets.ECR_NAME | lower }}  # Ensure lowercase repository name
  CONTAINER_NAME: "app"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and Push Docker image
        id: build-image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG=$COMMIT_SHA
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY
          
          # Ensure all characters are lowercase
          IMAGE_URI=$(echo "$IMAGE_URI" | tr '[:upper:]' '[:lower:]')
          
          docker build --no-cache -t $IMAGE_URI:$IMAGE_TAG -t $IMAGE_URI:latest .
          docker push $IMAGE_URI:$IMAGE_TAG
          docker push $IMAGE_URI:latest
          
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_FULL=$IMAGE_URI:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Create PEM file
        run: |
          echo "${{ secrets.EC2_KEY }}" > dev-key.pem
          chmod 400 dev-key.pem

      - name: Deploy to EC2
        run: |
          ssh -i dev-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << 'EOSSH'
            set -e  # Exit on error
            
            # Export AWS credentials
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            
            # Define image details from environment
            IMAGE_URI=${{ env.IMAGE_URI }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            IMAGE_FULL="$IMAGE_URI:$IMAGE_TAG"
            
            # Clean up previous container
            sudo docker stop $CONTAINER_NAME || true
            sudo docker rm $CONTAINER_NAME || true
            
            # Login to ECR (fresh login each time)
            aws ecr get-login-password --region $AWS_REGION | \
            sudo docker login --username AWS --password-stdin $IMAGE_URI
            
            # Pull the new image
            sudo docker pull "$IMAGE_FULL"
            
            # Run the container (fixed command)
            sudo docker run -d \
              --name $CONTAINER_NAME \
              -p 80:8080 \
              --restart unless-stopped \
              "$IMAGE_FULL"
              
            # Clean up unused images
            sudo docker image prune -af
          EOSSH

name: CI/CD Pipeline

on:
  push:
    branches: [ "development" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
          docker login --username AWS --password-stdin 941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and Push Docker image
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          IMAGE_URI=941377157856.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_NAME }}
          docker build --no-cache -t $IMAGE_URI:latest -t $IMAGE_URI:$COMMIT_SHA .
          docker push $IMAGE_URI:latest
          docker push $IMAGE_URI:$COMMIT_SHA
          echo "IMAGE_TAG=$COMMIT_SHA" >> $GITHUB_ENV
      - name: Create PEM file
        run: |
          echo "$PEM_FILE" > dev-key.pem
          chmod 400 dev-key.pem
        env:
          PEM_FILE: ${{ secrets.EC2_KEY }}

      - name: SSH and Deploy on EC2
        run: |
          # 🔧 CHANGED: Removed surrounding single quotes so GitHub interpolates secrets correctly
          ssh -i dev-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} << EOF
            echo "✅ Logged into EC2"
            # ✅ ADDED: Set AWS credentials inside EC2 to allow ECR login
            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
             # Create AWS credentials/config files
            mkdir -p ~/.aws
            printf "[default]\naws_access_key_id=%s\naws_secret_access_key=%s\n" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
            printf "[default]\nregion=%s\noutput=json\n" "$AWS_REGION" > ~/.aws/config

            ECR_DOMAIN="941377157856.dkr.ecr.${AWS_REGION}.amazonaws.com"
            REPO_NAME="${{ secrets.ECR_NAME }}"
            IMAGE_URI="$ECR_DOMAIN/$REPO_NAME"
            TAG="${{ env.IMAGE_TAG }}"

            echo "🔐 Logging into ECR inside EC2..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_DOMAIN

            echo "🛑 Stopping old container..."
            sudo docker stop app || true
            sudo docker rm app || true

            echo "🧹 Cleaning old images..."
            sudo docker rmi -f $IMAGE_URI:latest || true
            sudo docker rmi -f $IMAGE_URI:$TAG || true

            echo "⬇️ Pulling new image..."
            sudo docker pull $IMAGE_URI:$TAG

            echo "🚀 Running new container..."
            sudo docker run -d --name app -p 80:8080 $IMAGE_URI:$TAG
          EOF
